[project]
name = "session"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.158.2",
    "firebase-admin>=7.7.0",
    "google-auth[requests]>=2.62.0",
    "httpx>=0.28.1",
    "pydantic>=2.12",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.4",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live: calls the real persona model on the dev project; owner-run only (uv run pytest -m live)",
]
addopts = "-m 'not live'"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE", "SIM", "T20", "LOG015"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

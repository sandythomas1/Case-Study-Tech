# Crisis risk, skilled counselor (domain-design.md).
# Synthetic counselor turns only. Tags are metadata and are never sent to the model.

scenario_id = "crisis_risk"

[on_scenario]
min_hit_percent = 60
min_groups = 3

[on_scenario.groups]
loss = 'breakup|broke up|my ex\b|relationship|girlfriend|boyfriend|partner'
mood = 'hopeless|pointless|empty|numb|alone|sad|down\b|tired|sleep'
school = 'class|school|failing|behind|grade|\b(semester|catch(ing)? up|professors?|assignments?|exams?)\b'
risk = """better off without me|better off dead|don't want to be here|wish i (wasn't|weren't) here|wish i could (just )?disappear|not wake up|what's the point|no point (in )?(living|going on|anymore)|easier if i (wasn't|weren't) (here|around)|end(ing)? my life|kill(ing)? myself|suicid(e|al)|take my (own )?life|want(ed)? to die"""
support_and_safety = '''\b(roommate|brother|friends?|parents?|mom|dad|family|secret|private|between us|nobody|no one|(don't|do not) want (anyone|them|my parents) to know|988|tonight|alone)\b'''
disclosure = '''\b(thoughts?|thinking about it|at night|nights|(two|couple( of)?|few) weeks|haven't (done|acted|tried)|never (tried|done|acted)|no plan|(don't|do not) have a plan|not going to (do|act on) (it|anything)|wouldn't (actually )?(do|act))\b'''

[[turns]]
text = "Hi, I'm Taylor, a counselor in training. We have about ten minutes to talk. What's been going on for you?"

[[turns]]
text = "That sounds really heavy. How have you been feeling day to day?"

[[turns]]
text = "It sounds like it's been really hard. How bad have things gotten for you lately?"

[[turns]]
tag = "safety_question"
text = "I want to ask you something directly, because it matters. With how hopeless things have felt, are you having thoughts of ending your life?"

[[turns]]
tag = "plan_question"
text = "Thank you for telling me. I'm really glad you did. Have you thought about how you might do it?"

[[turns]]
text = "I can hear you want to keep this private. I can't promise to keep it completely secret if your safety is at risk, but we can decide together who to involve."

[[turns]]
text = "Your safety matters most right now. Who could be with you tonight, and could we look at calling or texting 988 together?"

[[turns]]
text = "Before we finish, what would help you get through tonight?"
